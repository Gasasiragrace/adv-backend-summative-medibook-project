<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1950 670" width="1950" height="670" font-family="Helvetica, Arial, sans-serif">
<rect width="1950" height="670" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#111">MediBook - Database Schema (3NF)</text>
<text x="1920" y="36" font-size="12" text-anchor="end" fill="#6b7280">PK = primary key   FK = foreign key   UQ = part of a UNIQUE key</text>
<rect x="30" y="60" width="540" height="174" rx="8" fill="#fff" stroke="#0f766e" stroke-width="2"/><path d="M30 68 a8 8 0 0 1 8 -8 h524 a8 8 0 0 1 8 8 v28 h-540 z" fill="#0f766e"/><text x="44" y="84" font-size="16" font-weight="700" fill="#fff">patients</text><text x="40" y="114" font-size="11" font-weight="700" fill="#b45309">PK</text><text x="74" y="114" font-size="13" font-weight="600" fill="#111">id</text><text x="215" y="114" font-size="12" font-family="monospace" fill="#374151">INT UNSIGNED</text><text x="415" y="114" font-size="11" fill="#6b7280">AUTO_INCREMENT</text><rect x="31" y="123" width="538" height="26" fill="#f5f7fa"/><text x="74" y="140" font-size="13" font-weight="600" fill="#111">full_name</text><text x="215" y="140" font-size="12" font-family="monospace" fill="#374151">VARCHAR(100)</text><text x="415" y="140" font-size="11" fill="#6b7280">NOT NULL</text><text x="40" y="166" font-size="11" font-weight="700" fill="#6b21a8">UQ</text><text x="74" y="166" font-size="13" font-weight="600" fill="#111">email</text><text x="215" y="166" font-size="12" font-family="monospace" fill="#374151">VARCHAR(150)</text><text x="415" y="166" font-size="11" fill="#6b7280">NOT NULL, UNIQUE</text><rect x="31" y="175" width="538" height="26" fill="#f5f7fa"/><text x="74" y="192" font-size="13" font-weight="600" fill="#111">phone</text><text x="215" y="192" font-size="12" font-family="monospace" fill="#374151">VARCHAR(20)</text><text x="415" y="192" font-size="11" fill="#6b7280">NOT NULL</text><text x="74" y="218" font-size="13" font-weight="600" fill="#111">created_at</text><text x="215" y="218" font-size="12" font-family="monospace" fill="#374151">DATETIME</text><text x="415" y="218" font-size="11" fill="#6b7280">NOT NULL, DEFAULT NOW</text><rect x="700" y="60" width="540" height="330" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><path d="M700 68 a8 8 0 0 1 8 -8 h524 a8 8 0 0 1 8 8 v28 h-540 z" fill="#1d4ed8"/><text x="714" y="84" font-size="16" font-weight="700" fill="#fff">appointments</text><text x="710" y="114" font-size="11" font-weight="700" fill="#b45309">PK</text><text x="744" y="114" font-size="13" font-weight="600" fill="#111">id</text><text x="885" y="114" font-size="12" font-family="monospace" fill="#374151">INT UNSIGNED</text><text x="1085" y="114" font-size="11" fill="#6b7280">AUTO_INCREMENT</text><rect x="701" y="123" width="538" height="26" fill="#f5f7fa"/><text x="710" y="140" font-size="11" font-weight="700" fill="#1d4ed8">FK</text><text x="744" y="140" font-size="13" font-weight="600" fill="#111">patient_id</text><text x="885" y="140" font-size="12" font-family="monospace" fill="#374151">INT UNSIGNED</text><text x="1085" y="140" font-size="11" fill="#6b7280">NOT NULL to patients.id</text><text x="710" y="166" font-size="11" font-weight="700" fill="#1d4ed8">FK</text><text x="744" y="166" font-size="13" font-weight="600" fill="#111">doctor_id</text><text x="885" y="166" font-size="12" font-family="monospace" fill="#374151">INT UNSIGNED</text><text x="1085" y="166" font-size="11" fill="#6b7280">NOT NULL to doctors.id</text><rect x="701" y="175" width="538" height="26" fill="#f5f7fa"/><text x="710" y="192" font-size="11" font-weight="700" fill="#6b21a8">UQ</text><text x="744" y="192" font-size="13" font-weight="600" fill="#111">appt_datetime</text><text x="885" y="192" font-size="12" font-family="monospace" fill="#374151">DATETIME</text><text x="1085" y="192" font-size="11" fill="#6b7280">NOT NULL (slot start)</text><text x="744" y="218" font-size="13" font-weight="600" fill="#111">amount_paid</text><text x="885" y="218" font-size="12" font-family="monospace" fill="#374151">DECIMAL(10,2)</text><text x="1085" y="218" font-size="11" fill="#6b7280">NOT NULL, CHECK &gt;= 0</text><rect x="701" y="227" width="538" height="26" fill="#f5f7fa"/><text x="744" y="244" font-size="13" font-weight="600" fill="#111">status</text><text x="885" y="244" font-size="12" font-family="monospace" fill="#374151">ENUM('booked','cancelled')</text><text x="1085" y="244" font-size="11" fill="#6b7280">NOT NULL</text><text x="744" y="270" font-size="13" font-weight="600" fill="#111">refund_percent</text><text x="885" y="270" font-size="12" font-family="monospace" fill="#374151">TINYINT UNSIGNED</text><text x="1085" y="270" font-size="11" fill="#6b7280">NULL; 0/50/100</text><rect x="701" y="279" width="538" height="26" fill="#f5f7fa"/><text x="744" y="296" font-size="13" font-weight="600" fill="#111">refund_amount</text><text x="885" y="296" font-size="12" font-family="monospace" fill="#374151">DECIMAL(10,2)</text><text x="1085" y="296" font-size="11" fill="#6b7280">NULL; &lt;= amount_paid</text><text x="744" y="322" font-size="13" font-weight="600" fill="#111">cancelled_at</text><text x="885" y="322" font-size="12" font-family="monospace" fill="#374151">DATETIME</text><text x="1085" y="322" font-size="11" fill="#6b7280">NULL</text><rect x="701" y="331" width="538" height="26" fill="#f5f7fa"/><text x="744" y="348" font-size="13" font-weight="600" fill="#111">booked_on</text><text x="885" y="348" font-size="12" font-family="monospace" fill="#374151">DATETIME</text><text x="1085" y="348" font-size="11" fill="#6b7280">NOT NULL, DEFAULT NOW</text><text x="710" y="374" font-size="11" font-weight="700" fill="#6b21a8">UQ</text><text x="744" y="374" font-size="13" font-weight="600" fill="#111">active_flag</text><text x="885" y="374" font-size="12" font-family="monospace" fill="#374151">TINYINT (generated)</text><text x="1085" y="374" font-size="11" fill="#6b7280">1 if booked else NULL</text><rect x="1370" y="60" width="540" height="200" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/><path d="M1370 68 a8 8 0 0 1 8 -8 h524 a8 8 0 0 1 8 8 v28 h-540 z" fill="#7c3aed"/><text x="1384" y="84" font-size="16" font-weight="700" fill="#fff">doctors</text><text x="1380" y="114" font-size="11" font-weight="700" fill="#b45309">PK</text><text x="1414" y="114" font-size="13" font-weight="600" fill="#111">id</text><text x="1555" y="114" font-size="12" font-family="monospace" fill="#374151">INT UNSIGNED</text><text x="1755" y="114" font-size="11" fill="#6b7280">AUTO_INCREMENT</text><rect x="1371" y="123" width="538" height="26" fill="#f5f7fa"/><text x="1414" y="140" font-size="13" font-weight="600" fill="#111">full_name</text><text x="1555" y="140" font-size="12" font-family="monospace" fill="#374151">VARCHAR(100)</text><text x="1755" y="140" font-size="11" fill="#6b7280">NOT NULL</text><text x="1414" y="166" font-size="13" font-weight="600" fill="#111">specialty</text><text x="1555" y="166" font-size="12" font-family="monospace" fill="#374151">VARCHAR(80)</text><text x="1755" y="166" font-size="11" fill="#6b7280">NOT NULL</text><rect x="1371" y="175" width="538" height="26" fill="#f5f7fa"/><text x="1414" y="192" font-size="13" font-weight="600" fill="#111">consultation_fee</text><text x="1555" y="192" font-size="12" font-family="monospace" fill="#374151">DECIMAL(10,2)</text><text x="1755" y="192" font-size="11" fill="#6b7280">NOT NULL, CHECK &gt;= 0</text><text x="1414" y="218" font-size="13" font-weight="600" fill="#111">room</text><text x="1555" y="218" font-size="12" font-family="monospace" fill="#374151">VARCHAR(10)</text><text x="1755" y="218" font-size="11" fill="#6b7280">NOT NULL</text><rect x="1371" y="227" width="538" height="26" fill="#f5f7fa"/><text x="1414" y="244" font-size="13" font-weight="600" fill="#111">created_at</text><text x="1555" y="244" font-size="12" font-family="monospace" fill="#374151">DATETIME</text><text x="1755" y="244" font-size="11" fill="#6b7280">NOT NULL, DEFAULT NOW</text><g stroke="#111" stroke-width="2" fill="none">
<path d="M570 109 H635 V135 H700"/>
<path d="M1370 109 H1305 V161 H1240"/></g>
<g font-size="15" font-weight="700" fill="#111">
<text x="574" y="102">1</text><text x="678" y="128">N</text>
<text x="1350" y="102">1</text><text x="1222" y="154">N</text></g>
<text x="572" y="196" font-size="11" fill="#374151">1 patient : N appointments</text>
<text x="1246" y="196" font-size="11" fill="#374151">1 doctor : N appointments</text>
<rect x="30" y="410" width="1890" height="224" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="46" y="432" font-size="14" font-weight="700" font-family="inherit" fill="#111">BUSINESS-RULE CONSTRAINTS ON appointments</text><text x="46" y="452" font-size="12.5" font-weight="400" font-family="monospace" fill="#111">UNIQUE (doctor_id, appt_datetime, active_flag)  =&gt;  a doctor cannot have two ACTIVE</text><text x="46" y="472" font-size="12.5" font-weight="400" font-family="monospace" fill="#111">   appointments at the same date/time. active_flag is NULL once cancelled, and NULLs never</text><text x="46" y="492" font-size="12.5" font-weight="400" font-family="monospace" fill="#111">   collide in a UNIQUE index, so a cancelled slot is rebookable while its row is kept.</text><text x="46" y="512" font-size="12.5" font-weight="400" font-family="monospace" fill="#111">CHECK (MINUTE(appt_datetime) IN (0,30) AND SECOND(appt_datetime) = 0)   30-minute boundary</text><text x="46" y="532" font-size="12.5" font-weight="400" font-family="monospace" fill="#111">CHECK (TIME(appt_datetime) BETWEEN '09:00:00' AND '16:30:00')   slot must end by 17:00</text><text x="46" y="552" font-size="12.5" font-weight="400" font-family="monospace" fill="#111">CHECK (amount_paid &gt;= 0)   CHECK (refund_percent IN (0,50,100))   CHECK (refund_amount &lt;= amount_paid)</text><text x="46" y="572" font-size="12.5" font-weight="400" font-family="monospace" fill="#111">CHECK (status='booked' AND refund/cancel cols NULL  OR  status='cancelled' AND they are NOT NULL)</text><text x="46" y="592" font-size="12.5" font-weight="400" font-family="monospace" fill="#111">FKs use ON DELETE RESTRICT: patients/doctors with appointments cannot be deleted.</text><text x="46" y="612" font-size="12.5" font-weight="400" font-family="monospace" fill="#111">Enforced in application code (cannot be a CHECK): future-only bookings, 12 appointments/doctor/day cap.</text></svg>